[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-compass-gold-fx"
version = "1.0.0"
description = "Capital Compass v3 Gold/FX vertical-slice implementation baseline"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5"]

[tool.setuptools.packages.find]
where = ["src"]
